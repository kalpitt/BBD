# Cloudflare deploys the "Ask me" Worker from the repo root using this file.
# The website itself is served by GitHub Pages, not by this Worker.
name = "bbd-ask"
main = "worker/worker.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

# "Message Kalpit" form: sends email from bbd@kalpit.me (Cloudflare Email Routing).
# The inbox it goes to is the MSG_TO secret, set in the Cloudflare dashboard, not here.
[[send_email]]
name = "MAIL"

[vars]
DATA_URL = "https://kalpit.me/BBD/data.json"
ALLOWED_ORIGINS = "https://kalpit.me,https://www.kalpit.me"

# Visit counts (POST /hit, GET /stats): a SQLite Durable Object, free plan, nothing to set
# up in the dashboard. The first deploy creates it from the migration below. Never delete
# or rename the migration: that would wipe the counts.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]
